name: Build Android APK (Streaming)

# AlaveX Android streaming client (React Native).
# Mac and iPhone clients are SwiftUI (apps/apple). Host stays Tauri.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NDK_VERSION: "26.1.10909125"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components + NDK
        run: |
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install React Native dependencies
        working-directory: apps/react-native
        run: npm install

      - name: Build Android APK
        working-directory: apps/react-native/android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee "${GITHUB_WORKSPACE}/android-build.log"
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Collect release APK
        run: |
          set -euo pipefail
          APK=$(find apps/react-native/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          mkdir -p releases
          cp "$APK" releases/AlaveX-Streaming.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alavex-android-apk
          path: releases/AlaveX-Streaming.apk
          if-no-files-found: error

  publish-apk-to-site:
    name: Publish APK to public/downloads
    needs: android
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          name: alavex-android-apk
          path: artifacts/android

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          apk=$(find artifacts/android -name 'AlaveX-Streaming.apk' | head -n1)
          if [ -z "${apk:-}" ]; then
            apk=$(find artifacts/android -name '*signed*.apk' | head -n1)
          fi
          if [ -z "${apk:-}" ]; then
            apk=$(find artifacts/android -name '*.apk' | head -n1)
          fi
          cp "$apk" releases/AlaveX-Streaming.apk

      - name: Commit and push APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish Android streaming app (${{ github.sha }})"
          file_pattern: "releases/AlaveX-Streaming.apk"
          branch: ${{ github.event.repository.default_branch }}
